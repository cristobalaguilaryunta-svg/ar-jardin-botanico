<!DOCTYPE html>
<html lang="es">
<head>
    <title>Jardín Botánico AR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f8f9fa; }
        .Hotspot { background: #fff; border-radius: 20px; border: 2px solid #27ae60; padding: 6px 12px; cursor: pointer; font-weight: bold; }
        .FichaContenedor { background: none; border: none; padding: 0; pointer-events: none; }
        .FichaContenedor img { width: 280px; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: 3px solid white; }
        #infoPanel { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 20px; border-radius: 15px; width: 80%; z-index: 1000; text-align: center; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="infoPanel">
        <p id="infoText" style="margin: 0; font-size: 18px;"></p>
        <button onclick="document.getElementById('infoPanel').style.display='none'" style="margin-top:10px; padding:10px 20px;">Cerrar</button>
    </div>

    <model-viewer src="modelos/lyocrypt-tree-2743.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1">
        <button class="FichaContenedor" slot="hotspot-ficha" data-position="6.5m 2.2m -1.0m" data-normal="0 0 1">
            <img src="imagenes/pdf_albaricoque.png">
        </button>

        <button class="Hotspot" slot="hotspot-1" data-position="0.127m 1.882m 0.000m" onclick="hablar('Materia Orgánica: Nutrientes esenciales para el crecimiento.')"><span>Materia Orgánica</span></button>
        <button class="Hotspot" slot="hotspot-2" data-position="-0.271m 3.056m -0.151m" onclick="hablar('Tronco: Soporte principal y transporte de savia.')"><span>Tronco o raíz</span></button>
        <button class="Hotspot" slot="hotspot-5" data-position="-0.045m 4.477m 0.461m" onclick="hablar('Hojas: Realizan la fotosíntesis y respiración.')"><span>Hojas</span></button>
    </model-viewer>

    <audio id="musica" loop src="audio/fondo.mp3"></audio>

    <script>
        let sonidoOk = false;
        function hablar(txt) {
            if(!sonidoOk) { 
                document.getElementById('musica').play().catch(e => console.log("Audio bloqueado hasta interacción"));
                sonidoOk = true; 
            }
            document.getElementById('infoText').innerText = txt;
            document.getElementById('infoPanel').style.display = 'block';
        }
    </script>
</body>
</html>
