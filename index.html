<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardín Botánico AR - Panel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { color: #27ae60; margin-bottom: 30px; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .proyecto-btn { 
            display: block; background: #27ae60; color: white; padding: 15px; 
            margin: 10px 0; text-decoration: none; border-radius: 12px; 
            font-weight: bold; transition: transform 0.2s; 
        }
        .proyecto-btn:hover { transform: scale(1.05); background: #219150; }
        .status { font-size: 12px; color: #7f8c8d; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 Mis Proyectos</h1>
        <div id="lista-proyectos">
            <a href="prueba1/" class="btn proyecto-btn">🚀 Ir a Prueba 1</a>
        </div>
        <p class="status">Protegido por robots.txt</p>
    </div>
</body>
</html>
