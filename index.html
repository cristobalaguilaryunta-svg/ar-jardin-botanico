<!DOCTYPE html>
<html lang="es">
<head>
    <title>Jardín Botánico AR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f5; }
        model-viewer { width: 100vw; height: 100vh; --poster-color: transparent; }
        
        /* BOTÓN PARA ACTIVAR CÁMARA */
        #ar-button {
            background-color: #27ae60;
            border-radius: 30px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            z-index: 999;
            box-shadow: 0 10px 20px rgba(39, 174, 96, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* FICHA TÉCNICA (A 6.5 metros) */
        .Ficha img { 
            width: 300px; 
            border-radius: 15px; 
            border: 5px solid white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        /* BOTONES INTERACTIVOS */
        .Hotspot { 
            background: #fff; 
            border-radius: 25px; 
            border: 2px solid #27ae60; 
            padding: 8px 15px; 
            cursor: pointer; 
            font-weight: bold;
            color: #2c3e50;
        }

        /* MENSAJE DE AYUDA */
        #instrucciones {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instrucciones">
        Si no ves tu cámara, gira el árbol con el dedo 👆
    </div>

    <model-viewer 
        src="modelos/lyocrypt-tree-2743.glb" 
        ar 
        ar-modes="webxr quick-look" 
        camera-controls 
        shadow-intensity="1"
        environment-image="neutral"
        exposure="1">
        
        <button slot="ar-button" id="ar-button">
            <span>🌿</span> VER EN EL JARDÍN
        </button>

        <button class="Ficha" slot="hotspot-ficha" data-position="6.5m 2.2m -1.5m" data-normal="0 0 1">
            <img src="imagenes/pdf_albaricoque.png">
        </button>

        <button class="Hotspot" slot="hotspot-1" data-position="0.12m 1.88m 0m" onclick="alert('Materia Orgánica: Clave para el Naranjo Amargo')">
            Materia Orgánica
        </button>

        <button class="Hotspot" slot="hotspot-2" data-position="-0.27m 3.05m -0.15m" onclick="alert('Tronco: Estructura resistente')">
            Tronco
        </button>

    </model-viewer>

    <audio id="musica" loop src="audio/fondo.mp3"></audio>

    <script>
        // Al tocar cualquier parte, intentamos activar el audio
        document.addEventListener('click', () => {
            const audio = document.getElementById('musica');
            audio.play().catch(() => console.log("Audio esperando interacción"));
        }, { once: true });
    </script>

</body>
</html>
