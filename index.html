<!DOCTYPE html>
<html lang="es">
<head>
    <title>Jardín Botánico AR - Naranjo Amargo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #f0f3f5; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #ffffff; }

        /* Botón de Realidad Aumentada - Visible y claro */
        #ar-button {
            background-color: #27ae60;
            border-radius: 30px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            z-index: 999;
            box-shadow: 0 10px 20px rgba(39, 174, 96, 0.3);
        }

        /* Ficha técnica flotante */
        .Ficha img { 
            width: 300px; 
            border-radius: 15px; 
            border: 5px solid white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        /* Estilo de los puntos de información (Hotspots) */
        .Hotspot { 
            background: #ffffff; 
            border-radius: 20px; 
            border: 2px solid #27ae60; 
            padding: 8px 16px; 
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
        }

        /* Panel de información personalizado (evita el fallo de pantalla negra) */
        #panel-info {
            display: none; 
            position: fixed; 
            bottom: 120px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            width: 80%; 
            max-width: 400px;
            z-index: 2000; 
            text-align: center; 
            border: 3px solid #27ae60; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        #panel-info p { margin: 0 0 15px 0; font-size: 16px; line-height: 1.4; color: #333; }
        
        #panel-info button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Instrucciones superiores */
        #instrucciones {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 13px;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div id="instrucciones">Si no abre cámara, usa el dedo para explorar 👆</div>

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="cerrarInfo()">Cerrar</button>
    </div>

    <model-viewer 
        src="modelos/lyocrypt-tree-2743.glb" 
        ar 
        ar-modes="webxr quick-look" 
        camera-controls 
        shadow-intensity="1"
        environment-image="neutral"
        exposure="1">
        
        <button slot="ar-button" id="ar-button">
            🌿 VER EN EL JARDÍN
        </button>

        <button class="Ficha" slot="hotspot-ficha" data-position="6.5m 2.2m -1.5m" data-normal="0 0 1">
            <img src="imagenes/pdf_albaricoque.png">
        </button>

        <button class="Hotspot" slot="hotspot-1" data-position="0.12m 1.88m 0m" onclick="mostrarInfo('Materia Orgánica: El naranjo amargo prefiere suelos bien drenados y ricos en nutrientes orgánicos.')">
            Materia Orgánica
        </button>

        <button class="Hotspot" slot="hotspot-2" data-position="-0.27m 3.05m -0.15m" onclick="mostrarInfo('Tronco y Raíces: Su madera es muy apreciada en ebanistería y sus raíces deben estar bien aireadas.')">
            Tronco o raíz
        </button>

    </model-viewer>

    <audio id="musica" loop src="audio/fondo.mp3"></audio>

    <script>
        // Función para mostrar información sin salir de la cámara
        function mostrarInfo(texto) {
            document.getElementById('texto-info').innerText = texto;
            document.getElementById('panel-info').style.display = 'block';
            activarSonido(); // Intentamos activar sonido al tocar un punto
        }

        function cerrarInfo() {
            document.getElementById('panel-info').style.display = 'none';
        }

        // Función para el sonido (debe ser activada por el usuario)
        function activarSonido() {
            const audio = document.getElementById('musica');
            if (audio.paused) {
                audio.play().catch(e => console.log("Esperando interacción para audio"));
            }
        }

        // Activar sonido también al primer toque en cualquier sitio
        document.addEventListener('click', activarSonido, { once: true });
    </script>

</body>
</html>
