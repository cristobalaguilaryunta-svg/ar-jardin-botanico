<!DOCTYPE html>
<html lang="es">
<head>
    <title>Visor AR - Prueba 1</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Botón de AR central */
        #ar-button {
            background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 28px; color: white; font-weight: bold; z-index: 999;
        }

        /* Estilos de elementos flotantes */
        .ImagenFlotante { border: none; background: none; pointer-events: none; }
        .img-logo { width: 150px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .img-ficha { width: 280px; border: 4px solid white; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        
        .Hotspot { background: #fff; border-radius: 20px; border: 2px solid #27ae60; padding: 8px 15px; font-weight: bold; }
        
        #panel-info {
            display: none; position: fixed; bottom: 120px; left: 50%; 
            transform: translateX(-50%); background: white; padding: 20px; 
            border-radius: 20px; width: 85%; max-width: 400px; z-index: 2000; 
            text-align: center; border: 3px solid #27ae60; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;">Cerrar</button>
    </div>

    <model-viewer 
        src="modelo.glb" 
        ar 
        ar-modes="webxr quick-look" 
        ar-scale="auto" 
        ar-placement="floor" 
        camera-controls 
        shadow-intensity="1"
        touch-action="pan-y">
        
        <button slot="ar-button" id="ar-button">🌿 INICIAR EXPERIENCIA AR</button>

        <div class="ImagenFlotante" slot="hotspot-logo" data-position="-3.5m 1.8m -0.5m">
            <img src="logo.png" class="img-logo">
        </div>

        <div class="ImagenFlotante" slot="hotspot-ficha" data-position="3.5m 1.8m -0.5m">
            <img src="ficha.png" class="img-ficha">
        </div>

        <button class="Hotspot" slot="hotspot-1" data-position="0.12m 1.88m 0m" onclick="mostrarInfo('Materia Orgánica: Clave para el desarrollo del fruto.')">Info 1</button>
        <button class="Hotspot" slot="hotspot-2" data-position="-0.27m 3.05m -0.15m" onclick="mostrarInfo('Tronco: Estructura principal de soporte.')">Info 2</button>

    </model-viewer>

    <audio id="musica" loop src="fondo.mp3"></audio>

    <script>
        const audio = document.getElementById('musica');
        function mostrarInfo(t) {
            document.getElementById('texto-info').innerText = t;
            document.getElementById('panel-info').style.display = 'block';
            if (audio.paused) audio.play();
        }
        document.addEventListener('click', () => { if (audio.paused) audio.play(); }, { once: true });
    </script>
</body>
</html>
