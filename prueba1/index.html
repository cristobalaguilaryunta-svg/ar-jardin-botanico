<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Jardín Botánico</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }

        /* INTERFAZ */
        .logo-fijo { position: absolute; top: 55px; left: 10px; width: 65px; z-index: 5; pointer-events: none; }
        .ficha-fija { position: absolute; bottom: 85px; right: 15px; width: 140px; z-index: 5; pointer-events: none; }
        
        .controles-fijos {
            position: absolute; top: 10px; width: 100%;
            display: flex; justify-content: center; gap: 8px; z-index: 10;
        }
        .btn-info {
            background: white; border: 2px solid #27ae60; border-radius: 12px;
            padding: 8px 14px; font-weight: bold; pointer-events: auto;
        }

        /* EL BOTÓN VERDE (EL PROTAGONISTA) */
        #ar-button {
            background-color: #27ae60;
            color: white;
            border-radius: 30px;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            font-size: 14px;
            
            /* Posicionamiento radical para que sea clickeable */
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999; /* Por encima de todo */
            display: block !important;
            visibility: visible !important;
        }

        #panel-info {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; width: 70%; z-index: 10000;
            border: 4px solid #27ae60; text-align: center;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="modelo.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button">🌿 INICIAR REALIDAD AUMENTADA</button>

    </model-viewer>

    <div class="controles-fijos">
        <button class="btn-info" onclick="mostrarInfo('Hojas perennes.')">HOJAS</button>
        <button class="btn-info" onclick="mostrarInfo('Madera dura.')">TRONCO</button>
    </div>
    <img src="logo.png" class="logo-fijo">
    <img src="ficha.png" class="ficha-fija">

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:10px;">Cerrar</button>
    </div>

    <script>
        function mostrarInfo(m) {
            document.getElementById('texto-info').innerText = m;
            document.getElementById('panel-info').style.display = 'block';
        }
    </script>
</body>
</html>
