<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Jardín Botánico</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }

        #ar-button {
            background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 28px; color: white; font-weight: bold; z-index: 999;
        }

        /* Imágenes Opacas */
        .ImagenFlotante { background: white; border-radius: 12px; }
        .img-logo { width: 150px; border-radius: 10px; display: block; }
        .img-ficha { width: 320px; border-radius: 12px; border: 4px solid white; display: block; }

        /* Hotspots Sólidos (Sin transparencias) */
        .Hotspot { 
            background: #ffffff; border-radius: 20px; border: 3px solid #27ae60; 
            padding: 10px 18px; font-weight: bold; font-size: 14px; color: #1a1a1a;
            cursor: pointer; opacity: 1 !important; /* Forzamos opacidad total */
        }

        #panel-info {
            display: none; position: fixed; bottom: 120px; left: 50%; 
            transform: translateX(-50%); background: white; padding: 20px; 
            border-radius: 20px; width: 85%; max-width: 400px; z-index: 2000; 
            text-align: center; border: 4px solid #27ae60;
        }
    </style>
</head>
<body>

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:10px; font-weight:bold;">Entendido</button>
    </div>

    <model-viewer 
        src="modelo.glb" 
        ar ar-modes="webxr quick-look" ar-scale="auto" ar-placement="floor" 
        camera-controls 
        interaction-prompt="none"
        touch-action="pan-y">
        
        <button slot="ar-button" id="ar-button">🌿 ABRIR EN AR</button>

        <div class="ImagenFlotante" slot="hotspot-logo" data-position="-3.5m 2m 0.5m">
            <img src="logo.png" class="img-logo">
        </div>

        <div class="ImagenFlotante" slot="hotspot-ficha" data-position="3.5m 2m 0.5m">
            <img src="ficha.png" class="img-ficha">
        </div>

        <button class="Hotspot" slot="hotspot-1" data-position="0.5m 0.5m 0.8m" onclick="mostrarInfo('SUSTRATO: Tierra fértil.')">Sustrato</button>
        <button class="Hotspot" slot="hotspot-2" data-position="-0.5m 3m 0.8m" onclick="mostrarInfo('HOJAS: Perennes y aromáticas.')">Hojas</button>
        <button class="Hotspot" slot="hotspot-3" data-position="0.2m 1.8m 0.8m" onclick="mostrarInfo('TRONCO: Corteza lisa grisácea.')">Tronco</button>

    </model-viewer>

    <audio id="musica" loop src="fondo.mp3"></audio>

    <script>
        const audio = document.getElementById('musica');
        function mostrarInfo(m) {
            document.getElementById('texto-info').innerText = m;
            document.getElementById('panel-info').style.display = 'block';
            if (audio.paused) audio.play();
        }
        document.addEventListener('click', () => { if (audio.paused) audio.play(); }, { once: true });
    </script>
</body>
</html>
