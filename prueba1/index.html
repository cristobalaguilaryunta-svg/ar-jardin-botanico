<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Jardín Botánico</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f8f8f8; }

        /* Estilos de la Interfaz */
        .controles-fijos {
            position: absolute; top: 10px; width: 100%;
            display: flex; justify-content: center; gap: 8px; z-index: 2;
        }
        .btn-info {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #27ae60; border-radius: 12px;
            padding: 8px 14px; font-weight: bold; font-size: 11px; color: #1a1a1a;
        }

        .logo-fijo { position: absolute; top: 55px; left: 10px; width: 65px; z-index: 2; }
        .ficha-fija { 
            position: absolute; bottom: 85px; right: 15px; width: 140px; 
            z-index: 2; border: 3px solid white; border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #ar-button {
            background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            padding: 14px 24px; color: white; font-weight: bold; z-index: 2;
        }

        /* Hotspots */
        .Hotspot { background: #fff; border-radius: 30px; border: 2px solid #27ae60; width: 20px; height: 20px; }
        .HotspotAnnotation {
            background: #fff; border-radius: 4px; padding: 4px 8px; color: #333;
            font-size: 12px; font-weight: bold; position: absolute; transform: translate(20px, -50%);
        }

        #panel-info {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; width: 70%; z-index: 3000;
            border: 4px solid #27ae60; text-align: center;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="modelo.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        ar-placement="floor"
        camera-controls 
        shadow-intensity="2" 
        interaction-prompt="auto">

        <div class="controles-fijos">
            <button class="btn-info" onclick="mostrarInfo('HOJAS: Perennes.')">HOJAS</button>
            <button class="btn-info" onclick="mostrarInfo('TRONCO: Madera dura.')">TRONCO</button>
        </div>

        <img src="logo.png" class="logo-fijo">
        <img src="ficha.png" class="ficha-fija">

        <button slot="ar-button" id="ar-button">🌿 INICIAR AR</button>

        <button class="Hotspot" slot="hotspot-1" data-position="0m 0.5m 0m">
            <div class="HotspotAnnotation">Planta</div>
        </button>

    </model-viewer>

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:10px;">Cerrar</button>
    </div>

    <script>
        function mostrarInfo(m) {
            document.getElementById('texto-info').innerText = m;
            document.getElementById('panel-info').style.display = 'block';
        }
    </script>
</body>
</html>
