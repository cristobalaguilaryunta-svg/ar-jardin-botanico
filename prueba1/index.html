<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Botánico - Versión Final Corregida</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f8f8f8; }

        /* --- INTERFAZ 2D (Fija en pantalla) --- */
        .controles-fijos {
            position: absolute; top: 10px; width: 100%;
            display: flex; justify-content: center; gap: 8px; z-index: 100;
        }
        .btn-info {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #27ae60; border-radius: 12px;
            padding: 8px 14px; font-weight: bold; font-size: 11px; color: #1a1a1a;
        }

        .logo-fijo { position: absolute; top: 55px; left: 10px; width: 65px; z-index: 50; }
        
        .ficha-fija { 
            position: absolute; bottom: 85px; right: 15px; width: 140px; 
            z-index: 50; border: 3px solid white; border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: width 0.3s;
        }
        .ficha-fija:active { width: 280px; }

        /* BOTÓN AR: Bajado para que no flote sobre la ficha */
        #ar-button-custom {
            background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            padding: 14px 28px; color: white; font-weight: bold; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 13px;
        }

        /* --- ELEMENTOS 3D / RA --- */
        .Hotspot {
            background: #fff; border-radius: 50%; border: 2px solid #27ae60;
            width: 18px; height: 18px; cursor: pointer;
        }
        .HotspotAnnotation {
            background: #fff; border-radius: 4px; padding: 4px 8px;
            color: #333; font-size: 11px; font-weight: bold;
            position: absolute; transform: translate(20px, -50%);
        }

        /* TEXTO LARGO: Solo nace en RA */
        .TextoLargoRA {
            display: none;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px; border-left: 8px solid #27ae60;
            padding: 15px; color: #1a1a1a; width: 230px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            font-size: 13px; line-height: 1.4;
        }

        model-viewer[ar-status="session-started"] .TextoLargoRA {
            display: block;
        }

        #panel-info {
            display: none; position: fixed; top: 45%; left: 50%; 
            transform: translate(-50%, -50%); background: white; padding: 25px; 
            border-radius: 20px; width: 75%; z-index: 2000; border: 4px solid #27ae60; text-align: center;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="modelo.glb" 
        ar ar-modes="webxr scene-viewer" 
        ar-placement="floor" ar-scale="fixed"
        scale="0.5 0.5 0.5"
        camera-controls auto-rotate
        shadow-intensity="2" shadow-softness="0.5"
        exposure="1.2" touch-action="pan-y">

        <button slot="ar-button" style="display:none;"></button>

        <button class="Hotspot" slot="hotspot-1" data-position="0 0.1 0.1" onclick="mostrarInfo('SUSTRATO: Mezcla nutritiva.')">
            <div class="HotspotAnnotation">Sustrato</div>
        </button>

        <button class="Hotspot" slot="hotspot-2" data-position="0 0.8 0" onclick="mostrarInfo('TRONCO: Madera de cítrico.')">
            <div class="HotspotAnnotation">Tronco</div>
        </button>

        <div slot="hotspot-extra" data-position="-0.7 1.1 0" data-normal="-1 0 0">
            <div class="TextoLargoRA">
                <b style="color:#27ae60;">FICHA TÉCNICA RA</b><br>
                Este ejemplar de Naranjo Amargo permite el estudio de su porte en escala real. 
                Utilice esta vista para planificar espacios de sombra y distancias de plantación.
            </div>
        </div>

    </model-viewer>

    <div class="controles-fijos">
        <button class="btn-info" onclick="mostrarInfo('HOJAS: Perennes y aromáticas.')">HOJAS</button>
        <button class="btn-info" onclick="mostrarInfo('TRONCO: Estructura grisácea.')">TRONCO</button>
        <button class="btn-info" onclick="mostrarInfo('SUSTRATO: Mezcla orgánica fértil.')">SUSTRATO</button>
    </div>

    <img src="logo.png" class="logo-fijo">
    <img src="ficha.png" class="ficha-fija">

    <button id="ar-button-custom" onclick="document.querySelector('model-viewer').activateAR()">
        🌿 INICIAR EXPERIENCIA AR
    </button>

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:12px 25px; border-radius:10px; font-weight:bold;">Cerrar</button>
    </div>

    <script>
        function mostrarInfo(m) {
            document.getElementById('texto-info').innerText = m;
            document.getElementById('panel-info').style.display = 'block';
        }
    </script>
</body>
</html>
