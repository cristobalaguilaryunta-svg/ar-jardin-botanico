<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Botánico - Edición Final</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f8f8f8; }

        /* --- INTERFAZ ORIGINAL (NO TOCAR) --- */
        .controles-fijos {
            position: absolute; top: 10px; width: 100%;
            display: flex; justify-content: center; gap: 8px; z-index: 100;
        }
        .btn-info {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #27ae60; border-radius: 12px;
            padding: 8px 14px; font-weight: bold; font-size: 11px; color: #1a1a1a;
        }
        .logo-fijo { position: absolute; top: 45px; left: 10px; width: 65px; z-index: 50; }
        .ficha-fija { 
            position: absolute; bottom: 65px; right: 15px; width: 150px; 
            z-index: 50; border: 3px solid white; border-radius: 10px; transition: all 0.3s ease;
        }
        .ficha-fija:active { width: 320px; bottom: 80px; }

        #ar-button-custom {
            background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%);
            padding: 14px 24px; color: white; font-weight: bold; z-index: 999;
            font-size: 13px;
        }

        /* --- HOTSPOTS ORIGINALES --- */
        .Hotspot {
            background: #fff; border-radius: 50%; border: 2px solid #27ae60;
            width: 18px; height: 18px; cursor: pointer;
        }
        .HotspotAnnotation {
            background: #fff; border-radius: 4px; padding: 4px 8px;
            color: #333; font-size: 11px; font-weight: bold;
            position: absolute; transform: translate(20px, -50%);
        }

        /* --- BLOQUE DE TEXTO LARGO (SOLO PARA RA) --- */
        .TextoLargoRA {
            display: none; /* Invisible en el visor 3D normal */
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px; border-left: 10px solid #27ae60;
            padding: 20px; color: #1a1a1a; width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            font-size: 14px; line-height: 1.5;
        }

        /* El truco: Solo se muestra cuando el móvil entra en RA */
        model-viewer[ar-status="session-started"] .TextoLargoRA {
            display: block;
        }

        #panel-info {
            display: none; position: fixed; top: 45%; left: 50%; 
            transform: translate(-50%, -50%); background: white; padding: 25px; 
            border-radius: 20px; width: 75%; z-index: 2000; border: 4px solid #27ae60; text-align: center;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="modelo.glb" 
        ar ar-modes="webxr scene-viewer" 
        ar-placement="floor" ar-scale="fixed"
        scale="0.5 0.5 0.5"
        camera-controls auto-rotate
        shadow-intensity="2" shadow-softness="0.5"
        touch-action="pan-y">

        <button slot="ar-button" style="display:none;"></button>

        <button class="Hotspot" slot="hotspot-1" data-position="0 0.1 0.1" onclick="mostrarInfo('SUSTRATO: Tierra fértil.')">
            <div class="HotspotAnnotation">Sustrato</div>
        </button>

        <button class="Hotspot" slot="hotspot-2" data-position="0 0.8 0" onclick="mostrarInfo('TRONCO: Madera resistente.')">
            <div class="HotspotAnnotation">Tronco</div>
        </button>

        <div slot="hotspot-extra" data-position="-0.7 1.2 0" data-normal="-1 0 0">
            <div class="TextoLargoRA">
                <b style="color:#27ae60; font-size:16px;">INFORMACIÓN DEL EJEMPLAR</b><br>
                Este Naranjo Amargo (Citrus Aurantium) es un ejemplar seleccionado por su vigorosidad. 
                En este modo de Realidad Aumentada puedes apreciar su escala real y detalles botánicos 
                en tu propio entorno. Ideal para estudios de paisajismo y botánica aplicada.
            </div>
        </div>

    </model-viewer>

    <div class="controles-fijos">
        <button class="btn-info" onclick="mostrarInfo('HOJAS: Perennes.')">HOJAS</button>
        <button class="btn-info" onclick="mostrarInfo('TRONCO: Estructura sólida.')">TRONCO</button>
    </div>

    <img src="logo.png" class="logo-fijo">
    <img src="ficha.png" class="ficha-fija">

    <button id="ar-button-custom" onclick="document.querySelector('model-viewer').activateAR()">
        🌿 INICIAR EXPERIENCIA AR
    </button>

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:10px;">Cerrar</button>
    </div>

    <script>
        function mostrarInfo(m) {
            document.getElementById('texto-info').innerText = m;
            document.getElementById('panel-info').style.display = 'block';
        }
    </script>
</body>
</html>
