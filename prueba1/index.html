<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Jardín Botánico</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f8f8f8; z-index: 1; }

        /* Interfaz: pointer-events: none es la clave para que el dedo "atraviese" y llegue al botón */
        .interfaz-usuario {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        /* Esto permite que los botones sí se puedan tocar */
        .interfaz-usuario button, .interfaz-usuario img { pointer-events: auto; }

        .controles-fijos {
            position: absolute; top: 10px; width: 100%;
            display: flex; justify-content: center; gap: 8px;
        }
        .btn-info {
            background: rgba(255, 255, 255, 0.9); border: 2px solid #27ae60; border-radius: 12px;
            padding: 8px 14px; font-weight: bold; font-size: 11px;
        }

        .logo-fijo { position: absolute; top: 55px; left: 10px; width: 65px; }
        .ficha-fija { 
            position: absolute; bottom: 85px; right: 15px; width: 140px; 
            border: 3px solid white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Botón AR: Slot obligatorio para que model-viewer lo reconozca */
        #ar-button {
            display: inline-block; background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            padding: 14px 24px; color: white; font-weight: bold; font-size: 13px;
            pointer-events: auto; z-index: 100;
        }

        #panel-info {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 20px; width: 70%; z-index: 2000;
            border: 4px solid #27ae60; text-align: center; pointer-events: auto;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="modelo.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        ar-placement="floor"
        camera-controls 
        shadow-intensity="2">

        <button slot="ar-button" id="ar-button">🌿 INICIAR AR</button>

    </model-viewer>

    <div class="interfaz-usuario">
        <div class="controles-fijos">
            <button class="btn-info" onclick="mostrarInfo('HOJAS: Perennes.')">HOJAS</button>
            <button class="btn-info" onclick="mostrarInfo('TRONCO: Madera dura.')">TRONCO</button>
        </div>
        <img src="logo.png" class="logo-fijo">
        <img src="ficha.png" class="ficha-fija">
    </div>

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:10px;">Cerrar</button>
    </div>

    <script>
        function mostrarInfo(m) {
            document.getElementById('texto-info').innerText = m;
            document.getElementById('panel-info').style.display = 'block';
        }
    </script>
</body>
</html>
