<model-viewer 
    src="modelo.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-scale="fixed" 
    ar-placement="floor"
    camera-controls 
    auto-rotate 
    shadow-intensity="2.5" 
    shadow-softness="0.2"
    exposure="1.2"
    environment-image="neutral"
    interaction-prompt="auto"
    interaction-prompt-style="wiggle"
    touch-action="pan-y">

    <button slot="ar-button" id="ar-button">🌿 INICIAR EXPERIENCIA AR</button>

    <button class="Hotspot" slot="hotspot-1" 
        data-surface="0 0 45 42 41 0.2 0.3 0.5" 
        data-position="0.2m 0.6m 0.3m" 
        onclick="mostrarInfo('SUSTRATO: Base sólida de tierra.')">
        <div class="HotspotAnnotation">Sustrato</div>
    </button>

    <button class="Hotspot" slot="hotspot-2" 
        data-surface="1 0 12 15 18 0.5 0.5 0.5"
        data-position="-0.3m 2.6m 0.3m" 
        onclick="mostrarInfo('HOJAS: Aroma cítrico natural.')">
        <div class="HotspotAnnotation">Hojas</div>
    </button>

</model-viewer>
