<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Jardín Botánico</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f8f8f8; }

        /* Contenedor de botones arriba */
        .controles-fijos {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: center; gap: 8px; z-index: 100;
        }
        .btn-info {
            background: white; border: 2px solid #27ae60; border-radius: 12px;
            padding: 6px 12px; font-weight: bold; font-size: 12px; color: #1a1a1a;
        }

        /* LOGO: Más arriba y más discreto */
        .logo-fijo { 
            position: absolute; top: 60px; left: 15px; width: 70px; 
            z-index: 50; opacity: 0.9; transition: transform 0.3s;
        }

        /* FICHA: Mucho más pequeña de inicio */
        .ficha-fija { 
            position: absolute; bottom: 110px; right: 15px; width: 120px; 
            z-index: 50; border: 2px solid white; border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: all 0.4s ease;
            opacity: 0.8;
        }

        /* Efecto al tocar la ficha para ampliarla sin perder fluidez */
        .ficha-fija:active, .ficha-fija:hover { width: 300px; opacity: 1; z-index: 1000; }

        #ar-button {
            background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 28px; color: white; font-weight: bold; z-index: 999;
        }

        #panel-info {
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: white; padding: 25px; 
            border-radius: 20px; width: 75%; z-index: 2000; border: 4px solid #27ae60;
            box-shadow: 0 0 50px rgba(0,0,0,0.5); text-align: center;
        }
    </style>
</head>
<body>

    <div class="controles-fijos">
        <button class="btn-info" onclick="mostrarInfo('HOJAS: Perennes, coriáceas y con un aroma cítrico muy intenso.')">HOJAS</button>
        <button class="btn-info" onclick="mostrarInfo('TRONCO: Estructura de madera dura con corteza lisa grisácea.')">TRONCO</button>
        <button class="btn-info" onclick="mostrarInfo('SUSTRATO: Tierra rica en materia orgánica y con buen drenaje.')">SUSTRATO</button>
    </div>

    <img src="logo.png" class="logo-fijo">
    
    <img src="ficha.png" class="ficha-fija" title="Toca para ampliar">

    <div id="panel-info">
        <p id="texto-info" style="font-size: 18px; line-height: 1.5;"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:12px 25px; border-radius:10px; font-weight:bold; cursor:pointer;">Entendido</button>
    </div>

    <model-viewer 
        src="modelo.glb" 
        ar ar-modes="webxr quick-look" ar-scale="auto"
        camera-controls 
        auto-rotate
        interaction-prompt="none"
        touch-action="pan-y">
        <button slot="ar-button" id="ar-button">🌿 VER EN REALIDAD AUMENTADA</button>
    </model-viewer>

    <audio id="musica" loop src="fondo.mp3"></audio>

    <script>
        const audio = document.getElementById('musica');
        function mostrarInfo(m) {
            document.getElementById('texto-info').innerText = m;
            document.getElementById('panel-info').style.display = 'block';
            if (audio.paused) audio.play();
        }
        document.addEventListener('click', () => { if (audio.paused) audio.play(); }, { once: true });
    </script>
</body>
</html>
