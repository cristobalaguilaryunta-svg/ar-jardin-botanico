<!DOCTYPE html>
<html lang="es">
<head>
    <title>Visor AR - Naranjo Amargo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        /* Estilos generales */
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; --poster-color: transparent; }
        
        /* Botón AR Principal */
        #ar-button {
            background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 28px; color: white; font-weight: bold; z-index: 999;
        }

        /* Contenedores de imágenes (Logo y Ficha) */
        .ImagenFlotante { 
            border: none; 
            background: white; /* Fondo blanco para evitar transparencia */
            border-radius: 12px;
            pointer-events: auto; /* Permite interactuar si quisieras poner links */
            display: block;
        }

        .img-logo { 
            width: 180px; 
            display: block;
            border-radius: 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        }

        .img-ficha { 
            width: 380px; /* Un poco más grande para lectura */
            display: block;
            border: 4px solid white; 
            border-radius: 12px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.4); 
        }
        
        /* Estilo de los botones (Hotspots) */
        .Hotspot { 
            background: #fff; border-radius: 20px; border: 2px solid #27ae60; 
            padding: 8px 15px; font-weight: bold; font-size: 14px; color: #2c3e50;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* Panel de información inferior */
        #panel-info {
            display: none; position: fixed; bottom: 120px; left: 50%; 
            transform: translateX(-50%); background: white; padding: 20px; 
            border-radius: 20px; width: 85%; max-width: 400px; z-index: 2000; 
            text-align: center; border: 3px solid #27ae60; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="panel-info">
        <p id="texto-info" style="font-size: 18px; line-height: 1.4; margin-bottom: 15px;"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight:bold;">Entendido</button>
    </div>

    <model-viewer 
        src="modelo.glb" 
        ar 
        ar-modes="webxr quick-look" 
        ar-scale="auto" 
        ar-placement="floor" 
        camera-controls 
        shadow-intensity="1"
        camera-orbit="0deg 75deg 5m"
        field-of-view="30deg"
        touch-action="pan-y">
        
        <button slot="ar-button" id="ar-button">🌿 INICIAR EXPERIENCIA AR</button>

        <div class="ImagenFlotante" slot="hotspot-logo" data-position="-3.5m 1.8m 0.5m">
            <img src="logo.png" class="img-logo">
        </div>

        <div class="ImagenFlotante" slot="hotspot-ficha" data-position="3.8m 1.8m 1.2m">
            <img src="ficha.png" class="img-ficha">
        </div>

        <button class="Hotspot" slot="hotspot-1" data-position="0.12m 1.2m 0.3m" onclick="mostrarInfo('Sustrato: Mezcla rica en materia orgánica y con buen drenaje para evitar encharcamientos.')">
            Sustrato
        </button>
        
        <button class="Hotspot" slot="hotspot-2" data-position="-0.27m 2.8m -0.1m" onclick="mostrarInfo('Hojas: Perennes, coriáceas y de un verde brillante. Contienen aceites esenciales muy aromáticos.')">
            Hojas
        </button>

        <button class="Hotspot" slot="hotspot-3" data-position="0.05m 1.8m 0.15m" onclick="mostrarInfo('Tronco: Estructura de madera dura con corteza lisa, típica de la familia de los cítricos.')">
            Tronco
        </button>

    </model-viewer>

    <audio id="musica" loop src="fondo.mp3"></audio>

    <script>
        const audio = document.getElementById('musica');
        function mostrarInfo(t) {
            document.getElementById('texto-info').innerText = t;
            document.getElementById('panel-info').style.display = 'block';
            if (audio.paused) audio.play();
        }
        // Activar audio al interactuar
        document.addEventListener('click', () => { if (audio.paused) audio.play(); }, { once: true });
    </script>
</body>
</html>
