<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Jardín Botánico</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        /* 1. DISEÑO GENERAL */
        body { margin: 0; background-color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f4f4f4; }

        /* 2. BOTÓN AR (MÓVIL) */
        #ar-button {
            background-color: #27ae60; border-radius: 30px; border: none;
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 28px; color: white; font-weight: bold; z-index: 999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 3. IMÁGENES (LOGO Y FICHA) */
        .ImagenFlotante { background: white; border-radius: 12px; display: block; border: none; }
        .img-logo { width: 160px; display: block; border-radius: 10px; }
        .img-ficha { 
            width: 350px; display: block; border-radius: 12px; 
            border: 5px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        }

        /* 4. ETIQUETAS (HOTSPOTS) */
        .Hotspot { 
            background: #ffffff; border-radius: 20px; border: 3px solid #27ae60; 
            padding: 10px 18px; font-weight: bold; font-size: 14px; color: #1a1a1a;
            cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        /* Efecto cuando el árbol tapa la etiqueta (opcional, suave) */
        .Hotspot:not([data-visible]) { opacity: 0.3; }

        /* 5. PANEL DE INFORMACIÓN TEXTUAL */
        #panel-info {
            display: none; position: fixed; bottom: 120px; left: 50%; 
            transform: translateX(-50%); background: white; padding: 20px; 
            border-radius: 20px; width: 85%; max-width: 400px; z-index: 2000; 
            text-align: center; border: 4px solid #27ae60; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        #panel-info p { font-size: 18px; color: #333; line-height: 1.5; margin-bottom: 15px; }
        #panel-info button { 
            background: #27ae60; color: white; border: none; padding: 10px 25px; 
            border-radius: 10px; font-weight: bold; cursor: pointer; 
        }
    </style>
</head>
<body>

    <div id="panel-info">
        <p id="texto-info"></p>
        <button onclick="cerrarInfo()">Entendido</button>
    </div>

    <model-viewer 
        src="modelo.glb" 
        ar ar-modes="webxr quick-look" ar-scale="auto" ar-placement="floor" 
        camera-controls shadow-intensity="1" shadow-softness="1"
        camera-orbit="45deg 75deg 6m" touch-action="pan-y">
        
        <button slot="ar-button" id="ar-button">🌿 ABRIR EN TU SALÓN (AR)</button>

        <div class="ImagenFlotante" slot="hotspot-logo" data-position="-3.8m 2.2m 0.5m">
            <img src="logo.png" class="img-logo">
        </div>

        <div class="ImagenFlotante" slot="hotspot-ficha" data-position="3.8m 2.2m 0.5m">
            <img src="ficha.png" class="img-ficha">
        </div>

        <button class="Hotspot" slot="hotspot-1" data-position="0.5m 0.8m 1.0m" onclick="mostrarInfo('SUSTRATO: Tierra fértil, bien drenada y rica en materia orgánica.')">
            Sustrato
        </button>
        
        <button class="Hotspot" slot="hotspot-2" data-position="-0.6m 3.2m 1.0m" onclick="mostrarInfo('HOJAS: Perennes, coriáceas y con un aroma cítrico muy intenso.')">
            Hojas
        </button>

        <button class="Hotspot" slot="hotspot-3" data-position="0.2m 1.8m 1.0m" onclick="mostrarInfo('TRONCO: Madera dura con corteza lisa de color grisáceo.')">
            Tronco
        </button>

    </model-viewer>

    <audio id="musica" loop src="fondo.mp3"></audio>

    <script>
        const audio = document.getElementById('musica');
        const panel = document.getElementById('panel-info');
        const texto = document.getElementById('texto-info');

        function mostrarInfo(mensaje) {
            texto.innerText = mensaje;
            panel.style.display = 'block';
            if (audio.paused) audio.play();
        }

        function cerrarInfo() {
            panel.style.display = 'none';
        }

        // Iniciar audio con el primer clic en la pantalla
        document.addEventListener('click', () => {
            if (audio.paused) audio.play();
        }, { once: true });
    </script>

</body>
</html>
