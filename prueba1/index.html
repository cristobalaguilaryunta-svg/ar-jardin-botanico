<!DOCTYPE html>
<html lang="es">
<head>
    <title>AR Jardín Botánico - Edición Final</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f8f8f8; }

        /* Capa de interfaz: El secreto es que sea HIJA del visor */
        .overlay-ra {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Deja pasar el click al 3D */
            z-index: 10;
        }
        .overlay-ra * { pointer-events: auto; } /* Los botones sí responden */

        .controles-fijos {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: center; gap: 10px;
        }
        .btn-info {
            background: rgba(255, 255, 255, 0.95); border: 2px solid #27ae60;
            border-radius: 15px; padding: 10px 16px; font-weight: bold;
            font-size: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo-fijo { position: absolute; top: 65px; left: 15px; width: 70px; }
        
        .ficha-fija { 
            position: absolute; bottom: 85px; right: 15px; width: 140px; 
            border: 3px solid white; border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.2); transition: width 0.3s;
        }
        .ficha-fija:active { width: 280px; }

        #ar-button {
            background-color: #27ae60; color: white; border: none;
            border-radius: 30px; padding: 15px 25px; font-weight: bold;
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }

        /* Hotspots (Puntos sobre la planta) */
        .Hotspot {
            background: #fff; border-radius: 50%; border: 3px solid #27ae60;
            width: 24px; height: 24px; cursor: pointer;
        }
        .HotspotAnnotation {
            background: #fff; border-radius: 6px; padding: 6px 12px;
            color: #1a1a1a; font-size: 13px; font-weight: bold;
            position: absolute; transform: translate(25px, -50%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); width: max-content;
        }

        #panel-info {
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: white; padding: 30px; 
            border-radius: 25px; width: 75%; z-index: 2000; border: 5px solid #27ae60;
            text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="modelo.glb" 
        ar 
        ar-modes="webxr scene-viewer" 
        ar-placement="floor"
        ar-scale="fixed"
        scale="0.5 0.5 0.5" 
        camera-controls 
        auto-rotate
        shadow-intensity="2" 
        shadow-softness="0.5"
        exposure="1.1"
        touch-action="pan-y">

        <div slot="ar-button" style="display:none;"></div> <div class="overlay-ra">
            <div class="controles-fijos">
                <button class="btn-info" onclick="mostrarInfo('HOJAS: Perennes y muy aromáticas.')">HOJAS</button>
                <button class="btn-info" onclick="mostrarInfo('TRONCO: Madera robusta grisácea.')">TRONCO</button>
            </div>

            <img src="logo.png" class="logo-fijo">
            <img src="ficha.png" class="ficha-fija">

            <button id="ar-button" onclick="document.querySelector('model-viewer').activateAR()">
                🌿 INICIAR EXPERIENCIA AR
            </button>
        </div>

        <button class="Hotspot" slot="hotspot-base" data-position="0m 0.2m 0m" onclick="mostrarInfo('SUSTRATO: Tierra fértil.')">
            <div class="HotspotAnnotation">Sustrato</div>
        </button>

    </model-viewer>

    <div id="panel-info">
        <p id="texto-info" style="font-size: 18px; margin-bottom: 20px;"></p>
        <button onclick="document.getElementById('panel-info').style.display='none'" style="background:#27ae60; color:white; border:none; padding:12px 30px; border-radius:12px; font-weight:bold;">ENTENDIDO</button>
    </div>

    <script>
        function mostrarInfo(m) {
            document.getElementById('texto-info').innerText = m;
            document.getElementById('panel-info').style.display = 'block';
        }
    </script>
</body>
</html>
